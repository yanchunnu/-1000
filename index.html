<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천자문 발음 학습</title><style>body{font-family:system-ui,sans-serif;background:#f7f3eb;color:#30291f;margin:0;padding:20px}.wrap{max-width:680px;margin:auto}h1{text-align:center}.card{background:white;border:1px solid #ddd0bc;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 3px 12px #0001}.han{text-align:center;font-size:30px;letter-spacing:3px}audio{width:100%;margin:15px 0}button{padding:10px 13px;margin:4px;border-radius:9px;border:1px solid #b6a68c;background:#fff;cursor:pointer}button.selected{background:#5b4633;color:white}label{display:block;margin:12px 0}input[type=range]{width:70%;vertical-align:middle}.note{font-size:13px;color:#70685e}</style></head><body><div class="wrap"><h1>千字文 · 천자문</h1><p class="han">天地玄黃 · 宇宙洪荒<br>日月盈昃 · 辰宿列張</p><p>언어별 발음을 선택하고 재생속도를 조절하세요.</p><div class="card"><h2>🇰🇷 한국어 읽기</h2><p>천지현황 · 우주홍황 · 일월영측 · 진수열장</p><audio id="ko" controls preload="none" src="https://resource2.heygen.ai/text_to_speech/3038c196c0e34c88ae877cc934fb6d31/fe3fbd12d84c41b5a791e6ea544f774d/id=25922042-2cc3-4fec-80c4-1b42fbcfc824.wav"></audio></div><div class="card"><h2>🇨🇳 중국어 읽기</h2><p>天地玄黄 · 宇宙洪荒 · 日月盈昃 · 辰宿列张</p><audio id="zh" controls preload="none" src="https://resource2.heygen.ai/text_to_speech/3038c196c0e34c88ae877cc934fb6d31/735c507fdc844be3b1528dd33f7dfb2a/id=0d31a3dd-f45a-4b6d-b973-0ae46c7e35f5.wav"></audio></div><div class="card"><h2>재생속도</h2><div id="buttons"></div><label>속도 미세조절 <input id="speed" type="range" min=".5" max="1.5" step=".05" value="1"> <strong id="rate">1.00×</strong></label><label><input id="repeat" type="checkbox"> 각 음원 반복 재생</label><button id="pause">모두 일시정지</button><p class="note">재생속도는 두 음원에 함께 적용됩니다. 음원은 외부 서버에서 제공되므로 링크가 만료되면 재생되지 않을 수 있습니다.</p></div></div><script>const audios=[document.getElementById('ko'),document.getElementById('zh')],speed=document.getElementById('speed'),rate=document.getElementById('rate'),buttons=document.getElementById('buttons');function setRate(v){speed.value=v;rate.textContent=Number(v).toFixed(2)+'×';audios.forEach(a=>a.playbackRate=Number(v));document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.rate)===Number(v)))}[.5,.75,1,1.25,1.5].forEach(v=>{let b=document.createElement('button');b.textContent=v+'×';b.dataset.rate=v;b.onclick=()=>setRate(v);buttons.appendChild(b)});speed.oninput=()=>setRate(speed.value);document.getElementById('repeat').onchange=e=>audios.forEach(a=>a.loop=e.target.checked);document.getElementById('pause').onclick=()=>audios.forEach(a=>a.pause());audios.forEach(a=>a.onplay=()=>audios.filter(x=>x!==a).forEach(x=>x.pause()));setRate(1)</script></body></html>
